
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templates and Prompt Store</title>
    <link rel="stylesheet" href="templates.css">
</head>

<body>

    <div class="templates-page">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h2>Virtual Arts</h2>

            <nav>
                <a href="index.html">Dashboard</a>
                <a href="generation.html">Image Generation</a>
                <a href="editor.html">AI Image Editor</a>
                <a href="projects.html">My Projects</a>
                <a href="templates.html" class="active">Templates</a>
            </nav>

        </aside>


        <!-- Main content -->
        <main class="templates-main">

            <header>
                <h1>Templates and Prompt Store</h1>
                <p>Discover creative prompts for your next artwork.</p>
            </header>


            <!-- Search -->
            <div class="search-section">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search prompts..."
                >

            </div>


            <!-- Category filters -->
            <div class="category-section">

                <button class="category-btn active" data-category="All">
                    All
                </button>

                <button class="category-btn" data-category="Portrait">
                    Portrait
                </button>

                <button class="category-btn" data-category="Nature">
                    Nature
                </button>

                <button class="category-btn" data-category="Fantasy">
                    Fantasy
                </button>

                <button class="category-btn" data-category="Architecture">
                    Architecture
                </button>

            </div>


            <!-- Prompt cards will appear here -->
            <div id="templateContainer" class="template-container">

            </div>

            <p id="noResults">
                No matching prompts found.
            </p>

        </main>

    </div>


    <script src="templates.js" defer></script>

</body>
</html>
